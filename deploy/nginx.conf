# Nginx site config for MAEX Trade (frontend + backend on one VPS).
# Put this at: /etc/nginx/sites-available/maex  then:
#   sudo ln -s /etc/nginx/sites-available/maex /etc/nginx/sites-enabled/maex
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOY.md) to add free HTTPS — it edits this file for you.

server {
    listen 80;
    server_name your-domain.com;   # <-- change to your domain (or server IP)

    # ---- Frontend (React build) ----
    # Copy metrix-plan-ui/dist to this folder on the server.
    root /var/www/metrix-plan-ui/dist;
    index index.html;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Backend API (includes /api/webhooks/nowpayments IPN) ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;
}
